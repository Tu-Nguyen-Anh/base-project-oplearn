version: "3.9"

services:
  service-product-content:
    build:
      context: ../../
      dockerfile: ./docker/dev/Dockerfile
    image: news_image:latest
    container_name: news
    ports:
      - ${PORT_EXTERNAL_DEV}:${PORT_INTERNAL}
    env_file:
      - .env
    networks:
      - soar-network
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  db-data:

networks:
  news-network:
    driver: bridge
