services:
  postgres_news:
    image: postgres:16.2-alpine
    container_name: postgres_news_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: news_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54123:5432"
    volumes:
      - postgres_news_data:/var/lib/postgresql/data
    shm_size: 256m
    networks:
      - news_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  redis_news:
    image: redis:6.2-alpine
    container_name: redis_news
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --save 20 1 --loglevel warning --maxmemory 400mb --maxmemory-policy allkeys-lru
    networks:
      - news_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  news:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile
    image: news_image:latest
    container_name: news
    restart: unless-stopped
    depends_on:
      - postgres_news
      - redis_news
    ports:
      - "8188:8188"
    env_file:
      - .env
    environment:
      # Ghi đè JAVA_OPTS từ Dockerfile.
      # Heap tối đa 512m + Metaspace 256m + overhead ~200m ≈ tổng ~968m < 1G limit.
      # ExitOnOutOfMemoryError: crash nhanh thay vì treo → container tự restart.
      # UseContainerSupport: JVM đọc đúng CPU/mem của container, không lấy của host.
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xms256m
        -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Xss512k
        -XX:+ExitOnOutOfMemoryError
    networks:
      - news_network
    deploy:
      resources:
        limits:
          # Cứng: container không bao giờ vượt ngưỡng này,
          # đảm bảo postgres/redis không bị ảnh hưởng khi spike.
          cpus: '1.0'
          memory: 1G
        reservations:
          # Mềm: Docker đảm bảo luôn có sẵn lượng này cho service.
          cpus: '0.25'
          memory: 512M

volumes:
  postgres_news_data:

networks:
  news_network:
    name: news_network
    driver: bridge
